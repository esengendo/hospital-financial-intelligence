version: '3.8'

services:
  hospital-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospital-financial-ai:latest
    container_name: hospital-financial-intelligence
    ports:
      - "8502:8502"
    volumes:
      # Mount data directories for persistence
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./visuals:/app/visuals
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add a development service
  hospital-ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospital-financial-ai:latest
    container_name: hospital-ai-dev
    ports:
      - "8503:8502"
    volumes:
      # Mount entire project for development
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    command: ["python", "main.py", "--dashboard-only", "--port", "8502"]
    profiles:
      - dev

# Optional: Add volumes for data persistence
volumes:
  hospital_data:
    driver: local
  hospital_models:
    driver: local 